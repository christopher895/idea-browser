name: Publish the idea browser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dist/**', 'scripts/build-data.mjs', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the collection and check it matches the published data
        run: |
          node scripts/build-data.mjs
          git diff --exit-code dist/data.js || { echo 'dist/data.js is stale. Run node scripts/build-data.mjs and commit.'; exit 1; }
      - name: Run checks
        run: |
          node --test tests/build-data.test.mjs
          node --check dist/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
