name: Personal idea digest
on:
  workflow_dispatch:
  # Candidate cadence: Mondays at 13:17 UTC. Disabled until explicitly configured.
  schedule:
    - cron: '17 13 * * 1'
permissions:
  contents: write
concurrency:
  group: personal-idea-digest
  cancel-in-progress: false
jobs:
  digest:
    if: vars.DIGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      DIGEST_BATCH_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate the idea collection
        run: node scripts/build-data.mjs
      - name: Reserve unsent ideas
        run: python3 scripts/digest.py --mode reserve
      - name: Persist reservations before sending
        run: |
          git config user.name 'Fieldnotes digest'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .automation/digest-state.json ]; then
            git add .automation/digest-state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Reserve personal digest delivery [skip ci]'
              git push origin HEAD:main
            fi
          fi
      - name: Send this batch
        run: python3 scripts/digest.py --mode send
      - name: Persist accepted delivery
        run: |
          if [ -f .automation/digest-state.json ]; then
            git add .automation/digest-state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record personal digest delivery [skip ci]'
              git push origin HEAD:main
            fi
          fi
